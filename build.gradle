import java.security.MessageDigest

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	def developmentBridgeSecret = layout.projectDirectory.file('runtime/bridge-secret.txt').asFile.absolutePath
	runs {
		client {
			vmArg "-Darenaagents.bridgeSecretFile=${developmentBridgeSecret}"
		}
		server {
			vmArg "-Darenaagents.bridgeSecretFile=${developmentBridgeSecret}"
		}
	}

	mods {
		"arenaagents" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "net.java.dev.jna:jna:5.17.0"
	compileOnly files("libs/fabric-carpet-26.1+v260402.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def coordinatorRuntimeIncludes = [
	'package.json',
	'package-lock.json',
	'config/**',
	'src/**',
	'node_modules/acorn/**',
]
def coordinatorDirectory = layout.projectDirectory.dir('coordinator')
def coordinatorPackageJson = coordinatorDirectory.file('package.json')
def coordinatorPackageLock = coordinatorDirectory.file('package-lock.json')
def coordinatorAcornDirectory = coordinatorDirectory.dir('node_modules/acorn')
def coordinatorAcornPackage = coordinatorDirectory.file('node_modules/acorn/package.json')
def coordinatorAcornModule = coordinatorDirectory.file('node_modules/acorn/dist/acorn.mjs')
def coordinatorManifest = layout.buildDirectory.file('generated/coordinator/coordinator-manifest.txt')
def isWindowsHost = System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('win')
def nodeRuntimeInstaller = layout.projectDirectory.file('scripts/install-node-runtime.ps1')
def bundledNodeRuntime = layout.projectDirectory.dir('runtime/toolchains/node')

tasks.register('assembleWindowsNodeRuntime', Exec) {
	group = 'build setup'
	description = 'Downloads and verifies the pinned Windows Node.js runtime for the standalone distribution.'
	onlyIf { isWindowsHost }
	commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
			nodeRuntimeInstaller.asFile.absolutePath, '-ProjectRoot', layout.projectDirectory.asFile.absolutePath
	inputs.file(nodeRuntimeInstaller)
	outputs.dir(bundledNodeRuntime)
}

if (isWindowsHost) {
	tasks.named('build') {
		dependsOn tasks.named('assembleWindowsNodeRuntime')
	}
}

tasks.register('installCoordinatorProductionDependencies', Exec) {
	group = 'build setup'
	description = 'Installs the coordinator production dependencies exactly as locked for packaging.'
	workingDir coordinatorDirectory
	def isWindows = isWindowsHost
	def npmExecutable = isWindows ? 'npm.cmd' : 'npm'
	commandLine npmExecutable, 'ci', '--ignore-scripts', '--omit=dev'
	ignoreExitValue = true
	inputs.files(coordinatorPackageJson, coordinatorPackageLock)
			.withPathSensitivity(PathSensitivity.RELATIVE)
	outputs.dir(coordinatorAcornDirectory)

	doFirst {
		def path = System.getenv('PATH')
		def available = path != null && path
				.split(java.util.regex.Pattern.quote(File.pathSeparator))
				.find { entry ->
					def executable = new File(entry, npmExecutable)
					!entry.isBlank() && executable.isFile() && (isWindows || executable.canExecute())
				}
		if (!available) {
			throw new GradleException(
					'Coordinator packaging requires npm on PATH to install locked production dependencies.'
			)
		}
	}

	doLast {
		if (executionResult.get().exitValue != 0) {
			throw new GradleException('Coordinator packaging failed because npm ci did not complete successfully.')
		}
		def missing = [coordinatorAcornPackage, coordinatorAcornModule]
				.collect { it.asFile }
				.findAll { !it.isFile() }
		if (!missing.isEmpty()) {
			throw new GradleException(
					'Coordinator packaging failed because npm ci did not install the required Acorn runtime.'
			)
		}
	}
}

tasks.register('generateCoordinatorManifest') {
	group = 'build'
	description = 'Generates the deterministic runtime coordinator file manifest.'
	dependsOn tasks.named('installCoordinatorProductionDependencies')
	inputs.files(fileTree(coordinatorDirectory) {
		coordinatorRuntimeIncludes.each { include it }
	}).withPathSensitivity(PathSensitivity.RELATIVE)
	outputs.file(coordinatorManifest)

	doLast {
		def coordinatorRoot = coordinatorDirectory.asFile
		def files = fileTree(coordinatorRoot) {
			coordinatorRuntimeIncludes.each { include it }
		}.files
		def prefixLength = coordinatorRoot.absolutePath.length() + 1
		def entries = files
			.collect {
				def path = it.absolutePath.substring(prefixLength).replaceAll('\\\\', '/')
				def hash = MessageDigest.getInstance('SHA-256').digest(it.bytes).encodeHex().toString()
				"${hash} ${path}"
			}
			.sort()
		def output = coordinatorManifest.get().asFile
		output.parentFile.mkdirs()
		output.text = entries.join('\n') + '\n'
	}
}

jar {
	def archiveName = project.archives_base_name
	inputs.property "archiveName", archiveName
	dependsOn tasks.named('generateCoordinatorManifest')

	from("LICENSE") {
		rename { "${it}_${archiveName}" }
	}
	from("NOTICE-FONTS.md")
	from("coordinator") {
		into "arena-agents/coordinator"
		coordinatorRuntimeIncludes.each { include it }
	}
	from(coordinatorManifest) {
		into "arena-agents/coordinator"
		rename { 'coordinator-manifest.txt' }
	}
}

def entrypointClassFiles = [
	layout.buildDirectory.file('classes/java/main/dev/agaminggod/arenaagents/ArenaAgents.class'),
	layout.buildDirectory.file('classes/java/client/dev/agaminggod/arenaagents/client/ArenaAgentsClient.class')
]

tasks.register('verifyEntrypoints') {
	group = 'verification'
	description = 'Verifies that every Fabric entrypoint declared by the baseline is compiled.'
	dependsOn tasks.named('compileJava'), tasks.named('compileClientJava')

	doLast {
		def missingEntrypoints = entrypointClassFiles
			.collect { it.get().asFile }
			.findAll { !it.isFile() }

		if (!missingEntrypoints.isEmpty()) {
			def relativePaths = missingEntrypoints.collect { project.relativePath(it) }.join(', ')
			throw new GradleException("Missing compiled Fabric entrypoints: ${relativePaths}")
		}
	}
}

def coreVerificationMainClass = 'dev.agaminggod.arenaagents.verification.VerificationMain'
def coreVerificationClassFile = layout.buildDirectory.file(
	"classes/java/test/${coreVerificationMainClass.replace('.', '/')}.class"
)

tasks.register('verifyCore', JavaExec) {
	group = 'verification'
	description = 'Runs the required dependency-free core verification main.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set(coreVerificationMainClass)
	jvmArgs '--enable-native-access=ALL-UNNAMED'

	doFirst {
		def verificationMain = coreVerificationClassFile.get().asFile
		if (!verificationMain.isFile()) {
			throw new GradleException(
				"Required core verification main is missing: ${project.relativePath(verificationMain)}"
			)
		}
	}
}

tasks.named('test') {
	failOnNoDiscoveredTests = false
}

def mapBlockStateCatalog = layout.projectDirectory.file('maps/registries/minecraft-26.1.2-block-states.json')
def mapCatalogExporterClasses = layout.buildDirectory.dir('classes/java/mapCatalogExporter')
def mapStructureDataFixerClasses = layout.buildDirectory.dir('classes/java/mapStructureDataFixer')

tasks.register('compileMapBlockStateCatalogExporter', JavaCompile) {
	dependsOn tasks.named('classes')
	source = files('src/test/java/dev/agaminggod/arenaagents/scenario/MapBlockStateCatalogExporter.java')
	classpath = sourceSets.test.compileClasspath + sourceSets.main.output
	destinationDirectory.set(mapCatalogExporterClasses)
	options.release = 25
}

tasks.register('exportMapBlockStateCatalog', JavaExec) {
	group = 'verification'
	description = 'Exports the exact Minecraft 26.1.2 vanilla block-state catalog.'
	dependsOn tasks.named('compileMapBlockStateCatalogExporter')
	classpath = files(mapCatalogExporterClasses) + sourceSets.main.runtimeClasspath + configurations.testRuntimeClasspath
	mainClass.set('dev.agaminggod.arenaagents.scenario.MapBlockStateCatalogExporter')
	args mapBlockStateCatalog.asFile.absolutePath
}

tasks.register('verifyMapBlockStateCatalog', JavaExec) {
	group = 'verification'
	description = 'Checks the pinned map block-state catalog against Minecraft 26.1.2.'
	dependsOn tasks.named('compileMapBlockStateCatalogExporter')
	classpath = files(mapCatalogExporterClasses) + sourceSets.main.runtimeClasspath + configurations.testRuntimeClasspath
	mainClass.set('dev.agaminggod.arenaagents.scenario.MapBlockStateCatalogExporter')
	args mapBlockStateCatalog.asFile.absolutePath, '--check'
}

tasks.register('exportOwnedMapFixture', JavaExec) {
	group = 'verification'
	description = 'Exports the deterministic project-owned structure-template fixture.'
	dependsOn tasks.named('compileMapBlockStateCatalogExporter')
	classpath = files(mapCatalogExporterClasses) + sourceSets.main.runtimeClasspath + configurations.testRuntimeClasspath
	mainClass.set('dev.agaminggod.arenaagents.scenario.MapBlockStateCatalogExporter')
	args '--owned-fixture', layout.projectDirectory.file('maps/selections/fixtures/tiny-owned-room.nbt').asFile.absolutePath
}

tasks.register('compileMapStructureDataFixer', JavaCompile) {
	dependsOn tasks.named('classes')
	source = files('src/test/java/dev/agaminggod/arenaagents/scenario/MapStructureDataFixer.java')
	classpath = sourceSets.test.compileClasspath + sourceSets.main.output
	destinationDirectory.set(mapStructureDataFixerClasses)
	options.release = 25
}

tasks.register('verifyMapStructureDataFixer', JavaExec) {
	group = 'verification'
	description = 'Verifies the bounded Minecraft structure-template DataFixer seam.'
	dependsOn tasks.named('compileMapStructureDataFixer')
	classpath = files(mapStructureDataFixerClasses) + sourceSets.main.runtimeClasspath + configurations.testRuntimeClasspath
	mainClass.set('dev.agaminggod.arenaagents.scenario.MapStructureDataFixer')
	args '--self-test'
}

tasks.register('upgradeMapStructure', JavaExec) {
	group = 'verification'
	description = 'Upgrades one ignored structure-template NBT with Minecraft STRUCTURE DataFixerUpper.'
	dependsOn tasks.named('compileMapStructureDataFixer')
	classpath = files(mapStructureDataFixerClasses) + sourceSets.main.runtimeClasspath + configurations.testRuntimeClasspath
	mainClass.set('dev.agaminggod.arenaagents.scenario.MapStructureDataFixer')
	if (project.hasProperty('mapInput') && project.hasProperty('mapOutput')) {
		args project.property('mapInput'), project.property('mapOutput')
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyCore'), tasks.named('verifyEntrypoints'), ':voice-addon:check'
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
