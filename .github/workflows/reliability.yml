name: Reliability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  coordinator:
    name: Coordinator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coordinator/package-lock.json
      - name: Install locked coordinator dependencies
        working-directory: coordinator
        run: npm ci --ignore-scripts --omit=dev
      - name: Test deterministic coordinator reliability suite
        working-directory: coordinator
        run: npm run test:portable

  java-and-package:
    name: Java and package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coordinator/package-lock.json
      - name: Assemble pinned standalone Node runtime
        shell: powershell
        run: |
          .\scripts\install-node-runtime.ps1 -ProjectRoot .
          .\scripts\verify-startup-packaging.ps1 -PackageRoot .
      - name: Verify Java, Fabric, and embedded coordinator
        shell: powershell
        run: |
          .\gradlew.bat clean check build --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\verify-coordinator-packaging.ps1 -JarPath .\build\libs\arena-agents-0.1.0.jar
          .\scripts\verify-distribution-runtime.ps1
